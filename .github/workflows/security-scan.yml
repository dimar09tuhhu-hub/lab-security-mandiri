name: DevSecOps Practice Pipeline

on:
  push:
    branches:
      - "**" # Triggers on push to any branch
  pull_request:

jobs:
  npm-audit:
    name: Dependency Scan (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Note: Juice Shop is intentionally vulnerable. npm audit will find issues.
      # We use '|| true' so the pipeline doesn't fail immediately, allowing us to see the report.
      - name: Run NPM Audit
        run: npm audit --audit-level=high

  semgrep-sast:
    name: Code Scan (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Code Scan (SAST)
        run: |
          # 1. Instal Semgrep secara global dengan mode quiet (-q) agar log bersih
          pip install semgrep -q

          # 2. Jalankan pemindaian dengan aturan audit keamanan dasar
          semgrep ci --config=p/security-audit --fail-on-severity=ERROR
